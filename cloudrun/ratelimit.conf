# Rate limit for the Gemini proxy, in the http context (a zone cannot be declared inside
# the server block that uses it).
#
# Why this exists: the proxy injects a real API key, the project has billing enabled, and
# the referer check in front of it only stops another web page — it does nothing against a
# script, which can set any header it likes. This does not make the endpoint private; it
# caps how fast anyone can spend the key.
#
# Who the caller is. On Cloud Run, $remote_addr is the sandbox's own link-local address
# (169.254.x.x) for every single request, so keying on it puts the whole world in one
# bucket: a busy minute would 429 everybody at once. The caller's real address is in
# X-Forwarded-For, but only its LAST entry — Google appends the address it actually saw,
# after whatever the client sent, so "1.2.3.4, <real>" is what a forger produces. Taking
# the first entry would let anyone pick a fresh bucket per request.
map $http_x_forwarded_for $client_ip {
    "~(?<last>[^,\s]+)\s*$"  $last;
    default                  $remote_addr;
}

# The number is deliberately generous. A class shares one school IP, so a limit tight
# enough to inconvenience an abuser would also push thirty classmates off the app at once.
# 2 r/s sustained with a burst of 40 is far above what any human produces (a turn of
# teaching or a check-in is seconds apart) and far below what a script wants.
#
# Each Cloud Run instance keeps its own count, so with N instances running the real cap is
# N times this. At this app's traffic that is almost always one instance.
limit_req_zone $client_ip zone=gemini:10m rate=120r/m;
