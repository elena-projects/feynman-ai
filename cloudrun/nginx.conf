server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Notes and textbook photos are sent to Gemini as base64 inside the request body, so
    # the body limit IS the upload limit. On Vercel the proxy was a serverless function
    # whose body is hard-capped at 4.5MB, which put the real ceiling near 3MB of original
    # file; Cloud Run accepts 32MB, and Gemini takes an inline request up to ~20MB, so the
    # app allows 14MB of original file and this leaves room for base64's extra third.
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Same-origin Gemini proxy. The page keeps calling /api/gemini (optionally with
    # ?model=... for the neural-voice model), exactly as it did against the Vercel
    # function, so the app itself needed no change. The API key is injected HERE from
    # the GEMINI_API_KEY env var — it never reaches the browser.
    location = /api/gemini {
        # Anti-abuse: only requests referred from our own app, so this cannot be used as
        # an open relay that burns the injected key's quota. Name the one host and nothing
        # else — a pattern like *.run.app would let anybody who deploys any Cloud Run
        # service send their visitors' browsers here on our key. Listing no scheme-less
        # "none" also means a request with no Referer at all is rejected.
        valid_referers feynman.elenaprojects.cc;
        if ($invalid_referer) { return 403; }

        # Allow only gemini-* model names through; anything else falls back to flash.
        set $model "gemini-2.5-flash";
        if ($arg_model ~ "^(gemini-[A-Za-z0-9._-]+)$") { set $model $1; }

        resolver 8.8.8.8 1.1.1.1 valid=300s ipv6=off;
        set $gemini_host generativelanguage.googleapis.com;
        proxy_pass https://$gemini_host/v1beta/models/$model:generateContent;
        proxy_ssl_server_name on;
        proxy_ssl_name generativelanguage.googleapis.com;
        proxy_set_header Host generativelanguage.googleapis.com;
        proxy_set_header x-goog-api-key "${GEMINI_API_KEY}";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 15s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # The app is one file, so a stale copy means a stale everything — never cache it.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
